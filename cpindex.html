<!DOCTYPE html>
<html lang="sq">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="PrintIM">
<meta name="theme-color" content="#0F6E56">
<title>Shtypshkronja IM</title>
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=DM+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
:root {
  --green: #1D9E75;
  --green-dark: #0F6E56;
  --green-light: #E1F5EE;
  --amber: #EF9F27;
  --amber-light: #FAEEDA;
  --amber-dark: #854F0B;
  --red: #E24B4A;
  --red-light: #FCEBEB;
  --red-dark: #A32D2D;
  --blue: #378ADD;
  --blue-light: #E6F1FB;
  --blue-dark: #185FA5;
  --bg: #F4F4F0;
  --surface: #FFFFFF;
  --border: rgba(0,0,0,0.08);
  --text: #1A1A18;
  --text2: #6B6B66;
  --text3: #A0A09A;
  --radius: 14px;
  --radius-sm: 9px;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; overflow: hidden; } body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); max-width: 430px; margin: 0 auto; position: relative; display: flex; flex-direction: column; }

/* TOPBAR */
.topbar { background: var(--surface); padding: 14px 18px 12px; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid var(--border); flex-shrink: 0; padding-top: max(14px, env(safe-area-inset-top)); }
.app-logo { width: 38px; height: 38px; border-radius: 10px; background: var(--green); display: flex; align-items: center; justify-content: center; color: white; font-size: 18px; flex-shrink: 0; }
.topbar-text { flex: 1; }
.topbar-title { font-size: 16px; font-weight: 600; color: var(--text); line-height: 1.2; }
.topbar-sub { font-size: 12px; color: var(--text2); margin-top: 1px; }
.notif-btn { width: 38px; height: 38px; border-radius: 50%; background: var(--bg); border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; color: var(--text2); font-size: 16px; position: relative; }
.notif-badge { position: absolute; top: 4px; right: 4px; width: 14px; height: 14px; border-radius: 50%; background: var(--red); color: white; font-size: 9px; font-weight: 600; display: flex; align-items: center; justify-content: center; border: 2px solid var(--surface); }

/* SCREENS */
.screen { display: none; padding: 16px; padding-bottom: 20px; animation: fadeIn 0.18s ease; }
.screen.active { display: block; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

/* BOTTOM NAV */
.bottom-nav { background: var(--surface); border-bottom: 1px solid var(--border); display: flex; flex-shrink: 0; }
.nav-item { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; cursor: pointer; padding: 4px 0; border: none; background: none; color: var(--text3); font-size: 10px; font-family: 'DM Sans', sans-serif; position: relative; transition: color 0.15s; }
.nav-item i { font-size: 20px; }
.nav-item.active { color: var(--green); }
.nav-dot { position: absolute; top: 2px; right: calc(50% - 16px); width: 7px; height: 7px; border-radius: 50%; background: var(--red); border: 1.5px solid var(--surface); }

/* STATS GRID */
.stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 16px; }
.stat-card { background: var(--surface); border-radius: var(--radius); padding: 14px; border: 1px solid var(--border); }
.stat-label { font-size: 11px; color: var(--text2); margin-bottom: 6px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.4px; }
.stat-val { font-size: 22px; font-weight: 600; color: var(--text); font-family: 'DM Mono', monospace; }
.stat-val.green { color: var(--green-dark); }
.stat-val.amber { color: var(--amber-dark); }

/* SECTION HEADER */
.sec-header { display: flex; align-items: center; justify-content: space-between; margin: 18px 0 10px; }
.sec-title { font-size: 13px; font-weight: 600; color: var(--text2); text-transform: uppercase; letter-spacing: 0.5px; }
.add-btn { width: 32px; height: 32px; border-radius: 50%; background: var(--green); border: none; color: white; font-size: 18px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: transform 0.15s, background 0.15s; }
.add-btn:active { transform: scale(0.92); background: var(--green-dark); }

/* CARDS */
.card { background: var(--surface); border-radius: var(--radius); border: 1px solid var(--border); margin-bottom: 8px; padding: 13px 14px; display: flex; align-items: center; gap: 12px; transition: transform 0.12s; cursor: pointer; }
.card:active { transform: scale(0.985); }
.card-icon { width: 38px; height: 38px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 17px; flex-shrink: 0; }
.card-body { flex: 1; min-width: 0; }
.card-title { font-size: 14px; font-weight: 500; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card-sub { font-size: 12px; color: var(--text2); margin-top: 2px; }
.card-right { text-align: right; flex-shrink: 0; }
.card-price { font-size: 13px; font-weight: 600; color: var(--text); margin-top: 4px; font-family: 'DM Mono', monospace; }

/* BADGES */
.badge { display: inline-block; font-size: 11px; font-weight: 600; padding: 3px 9px; border-radius: 20px; }
.badge.green { background: var(--green-light); color: var(--green-dark); }
.badge.amber { background: var(--amber-light); color: var(--amber-dark); }
.badge.red { background: var(--red-light); color: var(--red-dark); }
.badge.blue { background: var(--blue-light); color: var(--blue-dark); }
.badge.gray { background: #F0F0EC; color: var(--text2); }

/* INVENTORY ROWS */
.inv-row { background: var(--surface); border-radius: var(--radius); border: 1px solid var(--border); padding: 13px 14px; margin-bottom: 8px; display: flex; align-items: center; gap: 12px; }
.progress-wrap { flex: 1; }
.progress-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
.progress-name { font-size: 14px; font-weight: 500; color: var(--text); }
.progress-qty { font-size: 13px; font-weight: 600; font-family: 'DM Mono', monospace; }
.progress-bar { height: 5px; border-radius: 3px; background: var(--bg); overflow: hidden; }
.progress-fill { height: 100%; border-radius: 3px; transition: width 0.4s ease; }
.progress-warn { font-size: 11px; margin-top: 4px; color: var(--red); font-weight: 500; }

/* NOTIFICATION ITEMS */
.notif-item { background: var(--surface); border-radius: var(--radius); border: 1px solid var(--border); padding: 13px 14px; margin-bottom: 8px; display: flex; gap: 12px; align-items: flex-start; }
.notif-pip { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; margin-top: 5px; }
.notif-body { flex: 1; }
.notif-title { font-size: 14px; font-weight: 500; color: var(--text); display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.notif-desc { font-size: 12px; color: var(--text2); margin-top: 3px; }
.notif-time { font-size: 11px; color: var(--text3); margin-top: 2px; }

/* WORKER CARDS */
.worker-card { background: var(--surface); border-radius: var(--radius); border: 1px solid var(--border); padding: 13px 14px; margin-bottom: 8px; display: flex; align-items: center; gap: 12px; }
.avatar { width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 600; flex-shrink: 0; }
.worker-info { flex: 1; }
.worker-name { font-size: 14px; font-weight: 500; color: var(--text); }
.worker-sub { font-size: 12px; color: var(--text2); margin-top: 2px; }

/* CHART BARS */
.chart-wrap { background: var(--surface); border-radius: var(--radius); border: 1px solid var(--border); padding: 14px; }
.chart-row { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
.chart-row:last-child { margin-bottom: 0; }
.chart-lbl { font-size: 12px; color: var(--text2); width: 60px; flex-shrink: 0; }
.chart-bg { flex: 1; height: 16px; background: var(--bg); border-radius: 4px; overflow: hidden; }
.chart-fill { height: 100%; border-radius: 4px; background: var(--green); }
.chart-num { font-size: 12px; font-weight: 600; color: var(--text); width: 52px; text-align: right; font-family: 'DM Mono', monospace; }

/* MODAL */
.modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.45); z-index: 100; align-items: flex-end; justify-content: center; }
.modal-overlay.open { display: flex; animation: overlayIn 0.2s ease; }
@keyframes overlayIn { from { opacity: 0; } to { opacity: 1; } }
.modal { background: var(--surface); border-radius: 22px 22px 0 0; padding: 22px 20px calc(env(safe-area-inset-bottom, 0px) + 22px); width: 100%; max-width: 430px; max-height: 88vh; overflow-y: auto; animation: slideUp 0.22s ease; }
@keyframes slideUp { from { transform: translateY(40px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
.modal-handle { width: 38px; height: 4px; border-radius: 2px; background: var(--border); margin: 0 auto 18px; }
.modal-title { font-size: 17px; font-weight: 600; color: var(--text); margin-bottom: 18px; }
.field { margin-bottom: 14px; }
.field label { font-size: 12px; font-weight: 500; color: var(--text2); display: block; margin-bottom: 5px; text-transform: uppercase; letter-spacing: 0.3px; }
.field input, .field select { width: 100%; padding: 11px 14px; border-radius: var(--radius-sm); border: 1.5px solid var(--border); font-size: 15px; font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); outline: none; transition: border-color 0.15s; }
.field input:focus, .field select:focus { border-color: var(--green); background: var(--surface); }
.btn-row { display: flex; gap: 10px; margin-top: 18px; }
.btn { flex: 1; padding: 13px; border-radius: var(--radius-sm); border: 1.5px solid var(--border); font-size: 15px; font-weight: 500; font-family: 'DM Sans', sans-serif; cursor: pointer; transition: all 0.15s; }
.btn:active { transform: scale(0.97); }
.btn.cancel { background: var(--bg); color: var(--text2); }
.btn.primary { background: var(--green); color: white; border-color: var(--green); }
.btn.primary:active { background: var(--green-dark); }

/* STATUS PICKER */
.status-options { display: flex; flex-direction: column; gap: 10px; }
.status-opt { padding: 13px 16px; border-radius: var(--radius-sm); border: 1.5px solid; font-size: 15px; font-weight: 500; cursor: pointer; display: flex; align-items: center; gap: 10px; transition: transform 0.12s; font-family: 'DM Sans', sans-serif; }
.status-opt:active { transform: scale(0.97); }

/* EMPTY STATE */
.empty { text-align: center; padding: 40px 20px; color: var(--text3); }
.empty i { font-size: 40px; margin-bottom: 12px; display: block; }
.empty p { font-size: 14px; }

/* TOAST */
.toast { position: fixed; top: 70px; left: 50%; transform: translateX(-50%) translateY(-10px); background: var(--text); color: white; padding: 10px 20px; border-radius: 30px; font-size: 13px; font-weight: 500; z-index: 200; opacity: 0; transition: all 0.25s; pointer-events: none; white-space: nowrap; }
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>

<div class="topbar">
  <div class="app-logo"><i class="fa-solid fa-print"></i></div>
  <div class="topbar-text">
    <div class="topbar-title">Shtypshkronja IM</div>
    <div class="topbar-sub" id="user-label">Hyrë si: Besnik (Admin)</div>
  </div>
  <button class="notif-btn" onclick="switchTo('s-notif','n-notif')" aria-label="Njoftimet">
    <i class="fa-solid fa-bell"></i>
    <div class="notif-badge" id="notif-badge" style="display:none;">0</div>
  </button>
</div>

<!-- TOP NAV -->
<nav class="bottom-nav">
  <button class="nav-item active" id="n-home" onclick="switchTo('s-home','n-home')"><i class="fa-solid fa-house"></i><span>Kryefaqja</span></button>
  <button class="nav-item" id="n-orders" onclick="switchTo('s-orders','n-orders')"><i class="fa-solid fa-clipboard-list"></i><span>Porositë</span></button>
  <button class="nav-item" id="n-inv" onclick="switchTo('s-inv','n-inv')"><i class="fa-solid fa-box"></i><span>Stoku</span></button>
  <button class="nav-item" id="n-workers" onclick="switchTo('s-workers','n-workers')"><i class="fa-solid fa-users"></i><span>Punëtorët</span></button>
  <button class="nav-item" id="n-notif" onclick="switchTo('s-notif','n-notif');markNotifsRead()">
    <i class="fa-solid fa-bell"></i><span>Njoftime</span>
    <div class="nav-dot" id="nav-dot" style="display:none;"></div>
  </button>
</nav>
<!-- SCROLL WRAPPER -->
<div style="flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;">
<!-- SCREENS -->
<div id="s-home" class="screen active">
  <div class="stat-grid">
    <div class="stat-card"><div class="stat-label">Porosi sot</div><div class="stat-val green" id="stat-porosi">12</div></div>
    <div class="stat-card"><div class="stat-label">Fitim sot</div><div class="stat-val green" id="stat-fitim">€ 340</div></div>
    <div class="stat-card"><div class="stat-label">Në pritje</div><div class="stat-val amber" id="stat-pritje">4</div></div>
    <div class="stat-card"><div class="stat-label">Muaji</div><div class="stat-val" id="stat-muaji">€ 5,820</div></div>
  </div>
  <div class="sec-header"><span class="sec-title">Porositë e fundit</span></div>
  <div id="home-orders-list"></div>
</div>

<div id="s-orders" class="screen">
  <div class="sec-header">
    <span class="sec-title">Të gjitha porositë</span>
    <button class="add-btn" onclick="openModal('modal-order')" aria-label="Porosi e re"><i class="fa-solid fa-plus"></i></button>
  </div>
  <div id="orders-list"></div>
</div>

<div id="s-inv" class="screen">
  <div class="sec-header">
    <span class="sec-title">Stoku i materialeve</span>
    <button class="add-btn" onclick="openModal('modal-produkt')" aria-label="Shto material"><i class="fa-solid fa-plus"></i></button>
  </div>
  <div id="inv-list"></div>
</div>

<div id="s-workers" class="screen">
  <div class="sec-header">
    <span class="sec-title">Punëtorët</span>
    <button class="add-btn" onclick="openModal('modal-worker')" aria-label="Shto punëtor"><i class="fa-solid fa-plus"></i></button>
  </div>
  <div id="workers-list"></div>
  <div class="sec-header"><span class="sec-title">Aktiviteti sot</span></div>
  <div class="chart-wrap" id="worker-chart"></div>
</div>

<div id="s-notif" class="screen">
  <div class="sec-header">
    <span class="sec-title">Njoftimet</span>
    <span style="font-size:12px;color:var(--blue);cursor:pointer;font-weight:500;" onclick="clearNotifs()">Pastro</span>
  </div>
  <div id="notif-list"></div>
</div>

</div>


<!-- MODALS -->
<div class="modal-overlay" id="modal-order" onclick="outsideClose(event,'modal-order')">
  <div class="modal">
    <div class="modal-handle"></div>
    <div class="modal-title">Porosi e re</div>
    <div class="field"><label>Klienti</label><input type="text" id="o-client" placeholder="Emri i klientit"></div>
    <div class="field"><label>Produkti</label>
      <select id="o-prod"><option>Broshurë A4</option><option>Karta vizite</option><option>Roll-up banner</option><option>Poster</option><option>Etiketë</option><option>Vinyl / Sticker</option><option>Tjetër</option></select>
    </div>
    <div class="field"><label>Sasia</label><input type="number" id="o-qty" placeholder="p.sh. 500"></div>
    <div class="field"><label>Çmimi (€)</label><input type="number" id="o-price" placeholder="0.00" step="0.01"></div>
    <div class="field"><label>Punëtori</label><select id="o-worker"></select></div>
    <div class="btn-row">
      <button class="btn cancel" onclick="closeModal('modal-order')">Anulo</button>
      <button class="btn primary" onclick="addOrder()">Ruaj porosinë</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="modal-produkt" onclick="outsideClose(event,'modal-produkt')">
  <div class="modal">
    <div class="modal-handle"></div>
    <div class="modal-title">Shto material të ri</div>
    <div class="field"><label>Emri i materialit</label><input type="text" id="p-name" placeholder="p.sh. Letër A3 90gr"></div>
    <div class="field"><label>Kategoria</label>
      <select id="p-cat"><option>Letër</option><option>Bojë</option><option>Vinyl / Flex</option><option>Karton</option><option>Tjetër</option></select>
    </div>
    <div class="field"><label>Sasia aktuale</label><input type="number" id="p-qty" placeholder="p.sh. 5"></div>
    <div class="field"><label>Njësia (riz., m², copë...)</label><input type="text" id="p-unit" placeholder="riz."></div>
    <div class="field"><label>Stoku maksimal (ideal)</label><input type="number" id="p-max" placeholder="p.sh. 10"></div>
    <div class="btn-row">
      <button class="btn cancel" onclick="closeModal('modal-produkt')">Anulo</button>
      <button class="btn primary" onclick="addProdukt()">Shto</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="modal-worker" onclick="outsideClose(event,'modal-worker')">
  <div class="modal">
    <div class="modal-handle"></div>
    <div class="modal-title">Shto punëtor të ri</div>
    <div class="field"><label>Emri i plotë</label><input type="text" id="w-name" placeholder="Emri Mbiemri"></div>
    <div class="field"><label>Roli</label><select id="w-role"><option>Punëtor</option><option>Admin</option></select></div>
    <div class="field"><label>Telefoni (opsional)</label><input type="tel" id="w-phone" placeholder="+383 4X XXX XXX"></div>
    <div class="btn-row">
      <button class="btn cancel" onclick="closeModal('modal-worker')">Anulo</button>
      <button class="btn primary" onclick="addWorker()">Shto punëtorin</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="modal-status" onclick="outsideClose(event,'modal-status')">
  <div class="modal">
    <div class="modal-handle"></div>
    <div class="modal-title">Ndrysho statusin</div>
    <div class="status-options">
      <button class="status-opt" style="background:var(--green-light);color:var(--green-dark);border-color:#9FE1CB;" onclick="setOrderStatus('Gati','green')"><i class="fa-solid fa-check-circle"></i> Porosia u krye — Gati</button>
      <button class="status-opt" style="background:var(--amber-light);color:var(--amber-dark);border-color:#FAC775;" onclick="setOrderStatus('Në punë','amber')"><i class="fa-solid fa-spinner"></i> Vazhdon — Në punë</button>
      <button class="status-opt" style="background:var(--red-light);color:var(--red-dark);border-color:#F09595;" onclick="setOrderStatus('Vonuar','red')"><i class="fa-solid fa-clock"></i> Ka vonesë — Vonuar</button>
    </div>
    <button class="btn cancel" style="margin-top:14px;width:100%;" onclick="closeModal('modal-status')">Mbyll</button>
  </div>
</div>

<div class="toast" id="toast"></div>

  orders: [
    { id:1, client:'Albdesign SH.P.K.', prod:'Broshurë A4', qty:500, price:85, worker:'Besnik', status:'Gati', date:'04 Qer' },
    { id:2, client:'Roli Kafe', prod:'Roll-up banner', qty:1, price:45, worker:'Artan', status:'Në punë', date:'03 Qer' },
    { id:3, client:'Besnik D.', prod:'Karta vizite', qty:1000, price:30, worker:'Lirija', status:'Vonuar', date:'02 Qer' },
    { id:4, client:'Muzeu Kombëtar', prod:'Poster 70×100', qty:50, price:120, worker:'Besnik', status:'Gati', date:'01 Qer' },
    { id:5, client:'FoodCo', prod:'Etiketë', qty:2000, price:180, worker:'Lirija', status:'Gati', date:'30 Maj' }
  ],
  inventory: [
    { id:1, name:'Letër A4 80gr', cat:'Letër', qty:8, unit:'riz.', max:10 },
    { id:2, name:'Bojë CMYK Mimaki', cat:'Bojë', qty:2, unit:'njësi', max:8 },
    { id:3, name:'Vinyl self-adhesive', cat:'Vinyl / Flex', qty:15, unit:'m²', max:25 },
    { id:4, name:'Karton 350gr A3', cat:'Karton', qty:1, unit:'riz.', max:10 }
  ],
  workers: [
    { id:1, name:'Besnik Elshani', role:'Admin', orders:5, color:['#E1F5EE','#0F6E56'] },
    { id:2, name:'Artan Krasniqi', role:'Punëtor', orders:3, color:['#E6F1FB','#185FA5'] },
    { id:3, name:'Lirija Haxhiu', role:'Punëtor', orders:4, color:['#FAEEDA','#854F0B'] }
  ],
  notifications: [
    { text:'Porosia u krye', desc:'Broshurë A4 × 500 — Albdesign', worker:'Besnik', time:'10:32', color:'#1D9E75', badge:'Gati', cls:'green' },
    { text:'Porosi e vonuar', desc:'Karta vizite 1000 copë — Besnik D.', worker:'Lirija', time:'09:15', color:'#E24B4A', badge:'Vonuar', cls:'red' },
    { text:'Stoku i ulët', desc:'Bojë CMYK Mimaki — vetëm 2 njësi', worker:'Sistem', time:'08:00', color:'#EF9F27', badge:'Alarm', cls:'amber' }
  ],
  notifCount: 3,
  activeOrderId: null
};

function $(id){ return document.getElementById(id); }

function switchTo(sid, nid) {
  document.querySelectorAll('.screen').forEach(function(s){ s.classList.remove('active'); });
  document.querySelectorAll('.nav-item').forEach(function(b){ b.classList.remove('active'); });
  $(sid).classList.add('active');
  if(nid) $(nid).classList.add('active');
  if(sid === 's-home') renderHomeOrders();
}

function openModal(id){ $(id).classList.add('open'); }
function closeModal(id){ $(id).classList.remove('open'); }
function outsideClose(e, id){ if(e.target.id === id) closeModal(id); }

function showToast(msg) {
  var t = $('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(function(){ t.classList.remove('show'); }, 2500);
}

function updateNotifBadge() {
  var c = state.notifCount;
  $('notif-badge').textContent = c;
  $('notif-badge').style.display = c > 0 ? 'flex' : 'none';
  $('nav-dot').style.display = c > 0 ? 'block' : 'none';
}

function markNotifsRead(){ state.notifCount = 0; updateNotifBadge(); }

function clearNotifs(){
  state.notifications = [];
  state.notifCount = 0;
  updateNotifBadge();
  renderNotifs();
}

function addNotif(text, desc, worker, color, badge, cls) {
  var now = new Date();
  var time = now.getHours()+':'+String(now.getMinutes()).padStart(2,'0');
  state.notifications.unshift({ text:text, desc:desc, worker:worker, time:time, color:color, badge:badge, cls:cls });
  state.notifCount++;
  updateNotifBadge();
  renderNotifs();
}

function badgeStatusColor(s) {
  if(s==='Gati') return 'green';
  if(s==='Në punë') return 'amber';
  if(s==='Vonuar') return 'red';
  return 'blue';
}

function iconForCat(cat) {
  if(cat==='Bojë') return 'fa-droplet';
  if(cat==='Vinyl / Flex') return 'fa-layer-group';
  return 'fa-box-archive';
}

function pctColor(p) {
  if(p > 50) return '#1D9E75';
  if(p > 20) return '#EF9F27';
  return '#E24B4A';
}

function initials(name) {
  return name.split(' ').map(function(w){ return w[0]; }).join('').substring(0,2).toUpperCase();
}

function renderHomeOrders() {
  var list = $('home-orders-list');
  list.innerHTML = '';
  state.orders.slice(0,4).forEach(function(o){ list.appendChild(makeOrderCard(o)); });
}

function renderOrders() {
  var list = $('orders-list');
  list.innerHTML = '';
  if(state.orders.length === 0){ list.innerHTML = '<div class="empty"><i class="fa-solid fa-clipboard-list"></i><p>Asnjë porosi ende</p></div>'; return; }
  state.orders.forEach(function(o){ list.appendChild(makeOrderCard(o)); });
}

function makeOrderCard(o) {
  var cl = badgeStatusColor(o.status);
  var iconBg = cl==='green'?'#E1F5EE':cl==='amber'?'#FAEEDA':'#FCEBEB';
  var iconCol = cl==='green'?'#0F6E56':cl==='amber'?'#854F0B':'#A32D2D';
  var el = document.createElement('div');
  el.className = 'card';
  el.innerHTML = '<div class="card-icon" style="background:'+iconBg+';"><i class="fa-solid fa-file-invoice" style="color:'+iconCol+';"></i></div>'
    +'<div class="card-body"><div class="card-title">'+o.prod+'</div><div class="card-sub">'+o.client+' · '+o.worker+' · '+o.date+'</div></div>'
    +'<div class="card-right"><span class="badge '+cl+'">'+o.status+'</span><div class="card-price">€ '+o.price.toFixed(2)+'</div></div>';
  el.onclick = function(){ state.activeOrderId = o.id; openModal('modal-status'); };
  return el;
}

function renderInventory() {
  var list = $('inv-list');
  list.innerHTML = '';
  if(state.inventory.length === 0){ list.innerHTML = '<div class="empty"><i class="fa-solid fa-box"></i><p>Asnjë material ende</p></div>'; return; }
  state.inventory.forEach(function(item){
    var pct = Math.round((item.qty / item.max) * 100);
    var col = pctColor(pct);
    var warn = pct <= 20 ? '<div class="progress-warn"><i class="fa-solid fa-triangle-exclamation"></i> Pothuaj mbaroi — porosit!</div>' : pct <= 40 ? '<div class="progress-warn" style="color:var(--amber);"><i class="fa-solid fa-exclamation-circle"></i> Stok i ulët</div>' : '';
    var iconBg = pct > 50 ? '#E6F1FB' : pct > 20 ? '#FAEEDA' : '#FCEBEB';
    var iconCol = pct > 50 ? '#185FA5' : pct > 20 ? '#854F0B' : '#A32D2D';
    var el = document.createElement('div');
    el.className = 'inv-row';
    el.innerHTML = '<div class="card-icon" style="background:'+iconBg+';"><i class="fa-solid '+iconForCat(item.cat)+'" style="color:'+iconCol+';"></i></div>'
      +'<div class="progress-wrap"><div class="progress-top"><span class="progress-name">'+item.name+'</span><span class="progress-qty" style="color:'+col+';">'+item.qty+' '+item.unit+'<span style="font-size:11px;color:var(--text3);font-weight:400;"> / '+item.max+'</span></span></div>'
      +'<div class="progress-bar"><div class="progress-fill" style="width:'+pct+'%;background:'+col+';"></div></div>'+warn+'</div>';
    list.appendChild(el);
  });
}

function renderWorkers() {
  var list = $('workers-list');
  list.innerHTML = '';
  var maxO = Math.max.apply(null, state.workers.map(function(w){ return w.orders; })) || 1;
  state.workers.forEach(function(w){
    var el = document.createElement('div');
    el.className = 'worker-card';
    el.innerHTML = '<div class="avatar" style="background:'+w.color[0]+';color:'+w.color[1]+';">'+initials(w.name)+'</div>'
      +'<div class="worker-info"><div class="worker-name">'+w.name+'</div><div class="worker-sub">'+w.role+' · '+w.orders+' porosi sot</div></div>'
      +'<span class="badge green">Aktiv</span>';
    list.appendChild(el);
  });
  var chart = $('worker-chart');
  chart.innerHTML = '';
  var maxO2 = Math.max.apply(null, state.workers.map(function(w){ return w.orders; })) || 1;
  state.workers.forEach(function(w){
    var pct = Math.round((w.orders / maxO2) * 100);
    var row = document.createElement('div');
    row.className = 'chart-row';
    row.innerHTML = '<span class="chart-lbl">'+w.name.split(' ')[0]+'</span>'
      +'<div class="chart-bg"><div class="chart-fill" style="width:'+pct+'%;"></div></div>'
      +'<span class="chart-num">'+w.orders+' por.</span>';
    chart.appendChild(row);
  });
}

function renderNotifs() {
  var list = $('notif-list');
  list.innerHTML = '';
  if(state.notifications.length === 0){ list.innerHTML = '<div class="empty"><i class="fa-solid fa-bell-slash"></i><p>Asnjë njoftim i ri</p></div>'; return; }
  state.notifications.forEach(function(n){
    var el = document.createElement('div');
    el.className = 'notif-item';
    el.innerHTML = '<div class="notif-pip" style="background:'+n.color+';"></div>'
      +'<div class="notif-body"><div class="notif-title">'+n.text+' <span class="badge '+n.cls+'">'+n.badge+'</span></div>'
      +'<div class="notif-desc">'+n.desc+'</div>'
      +'<div class="notif-time">'+n.worker+' · sot '+n.time+'</div></div>';
    list.appendChild(el);
  });
}

function populateWorkerSelect() {
  var sel = $('o-worker');
  sel.innerHTML = '';
  state.workers.forEach(function(w){
    var opt = document.createElement('option');
    opt.value = w.name.split(' ')[0];
    opt.textContent = w.name.split(' ')[0];
    sel.appendChild(opt);
  });
}

function addOrder() {
  var client = $('o-client').value.trim();
  var prod = $('o-prod').value;
  var qty = parseInt($('o-qty').value) || 1;
  var price = parseFloat($('o-price').value) || 0;
  var worker = $('o-worker').value;
  if(!client){ showToast('Shkruaj emrin e klientit!'); return; }
  var now = new Date();
  var months = ['Jan','Shk','Mar','Pri','Maj','Qer','Kor','Gus','Sht','Tet','Nën','Dhj'];
  var date = now.getDate()+' '+months[now.getMonth()];
  var o = { id: Date.now(), client:client, prod:prod, qty:qty, price:price, worker:worker, status:'Në punë', date:date };
  state.orders.unshift(o);
  var wObj = state.workers.find(function(w){ return w.name.startsWith(worker); });
  if(wObj) wObj.orders++;
  addNotif('Porosi e re', prod+' — '+client, worker, '#185FA5', 'E re', 'blue');
  renderOrders();
  renderHomeOrders();
  renderWorkers();
  closeModal('modal-order');
  $('o-client').value=''; $('o-qty').value=''; $('o-price').value='';
  showToast('Porosia u shtua!');
}

function addProdukt() {
  var name = $('p-name').value.trim();
  var cat = $('p-cat').value;
  var qty = parseFloat($('p-qty').value) || 0;
  var unit = $('p-unit').value.trim() || 'njësi';
  var max = parseFloat($('p-max').value) || 10;
  if(!name){ showToast('Shkruaj emrin e materialit!'); return; }
  var item = { id:Date.now(), name:name, cat:cat, qty:qty, unit:unit, max:max };
  state.inventory.push(item);
  var pct = Math.round((qty/max)*100);
  if(pct <= 20) addNotif('Stoku i ulët', name+' — '+qty+' '+unit, 'Sistem', '#EF9F27', 'Alarm', 'amber');
  renderInventory();
  closeModal('modal-produkt');
  $('p-name').value=''; $('p-qty').value=''; $('p-unit').value=''; $('p-max').value='';
  showToast('Materiali u shtua!');
}

function addWorker() {
  var name = $('w-name').value.trim();
  var role = $('w-role').value;
  if(!name){ showToast('Shkruaj emrin e punëtorit!'); return; }
  var colors = [['#E1F5EE','#0F6E56'],['#E6F1FB','#185FA5'],['#FAEEDA','#854F0B'],['#FCEBEB','#A32D2D'],['#EAF3DE','#3B6D11']];
  var c = colors[state.workers.length % colors.length];
  state.workers.push({ id:Date.now(), name:name, role:role, orders:0, color:c });
  populateWorkerSelect();
  renderWorkers();
  closeModal('modal-worker');
  $('w-name').value=''; $('w-phone').value='';
  showToast(name+' u shtua!');
}

function setOrderStatus(status, cls) {
  var o = state.orders.find(function(x){ return x.id === state.activeOrderId; });
  if(o){ 
    o.status = status;
    var msg = status==='Gati' ? 'Porosia u krye' : status==='Vonuar' ? 'Porosi e vonuar' : 'Porosia vazhdues';
    var col = status==='Gati'?'#1D9E75':status==='Vonuar'?'#E24B4A':'#EF9F27';
    addNotif(msg, o.prod+' — '+o.client, o.worker, col, status, cls);
    renderOrders();
    renderHomeOrders();
    showToast('Statusi u ndryshua!');
  }
  closeModal('modal-status');
}

// Init
populateWorkerSelect();
renderHomeOrders();
renderOrders();
renderInventory();
renderWorkers();
renderNotifs();
updateNotifBadge();

if('serviceWorker' in navigator){ navigator.serviceWorker.register('sw.js'); }
</script>
</body>
</html>
